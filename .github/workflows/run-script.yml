name: Run Facebook Automation

on:
  schedule:
    # Runs automatically every hour. Adjust if you need a different frequency.
    - cron: '0 * * * *' 
  workflow_dispatch: # Lets you run it manually whenever you want

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Main Script
      env:
        # Add your environment variables/secrets here so python main.py can read them
        YOUR_SECRET_NAME: ${{ secrets.YOUR_SECRET_NAME }}
      run: |
        python main.py
